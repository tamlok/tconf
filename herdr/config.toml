onboarding = false

[terminal]
default_shell = "nu"
new_cwd = "~"

[keys]
prefix = "ctrl+g"
new_tab = "prefix+t"
copy_mode = "prefix+y"
previous_workspace = "prefix+shift+["
next_workspace = "prefix+shift+]"
previous_agent = "prefix+["
next_agent = "prefix+]"
focus_agent = "prefix+shift+1..9"
last_pane = "prefix+0"

[experimental]
pane_history = true
